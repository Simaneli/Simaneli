<a class="tap" style="left:4%;top:17.9%;width:92%;height:8.1%" href="https://simaneli.github.io/Simaneli/" aria-label="Интернет-магазин Simaneli"></a>
<button class="tap" id="armenian" style="left:8%;top:41.1%;width:40%;height:12.2%" aria-label="Говорить по-армянски"></button>
<button class="tap" id="chinese" style="left:51%;top:41.1%;width:40%;height:12.2%" aria-label="Говорить по-китайски"></button>
<button class="tap" id="stop" style="left:7%;top:54.2%;width:85%;height:4.3%" aria-label="Остановить запись"></button>
<div id="status" class="status" aria-live="polite"></div>
<div id="recognized" class="field hidden" role="textbox" contenteditable="true" aria-label="Распознанная речь. Можно ввести текст вручную"></div>
<div id="translated" class="field hidden" role="status" aria-label="Перевод"></div>
<button class="tap" id="edit" style="left:7%;top:70.5%;width:86%;height:6.5%" aria-label="Ввести текст и перевести"></button>
<button class="tap" id="speak" style="left:7%;top:82.2%;width:86%;height:6.3%" aria-label="Озвучить перевод"></button>
<a class="tap" style="left:6%;top:89.5%;width:89%;height:6.5%" href="tel:+8617520055552" aria-label="Позвонить нам"></a>
</main>
<div class="help">Если Safari запрещает распознавание речи, нажмите раздел «Распознанная речь», используйте диктовку на клавиатуре iPhone и коснитесь раздела «Перевод». Внешний сервис перевода может быть недоступен. Текст передаётся внешнему сервису MyMemory.</div>
<script>
(()=> {
const $=id=>document.getElementById(id);
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,recording=false,chosen='hy',locked=false;
const msg=t=>$('status').textContent=t;
const pair=()=>chosen==='hy'?'hy|zh-CN':'zh-CN|hy';
const targetLanguage=()=>chosen==='hy'?'zh-CN':'hy-AM';
function stop(){if(recognition){try{recognition.stop()}catch(e){}}recording=false}
$('stop').onclick=()=>{stop();msg('Запись остановлена')};
function fallback(){locked=true;$('recognized').classList.remove('hidden');msg('Микрофон недоступен. Введите текст или используйте диктовку клавиатуры iPhone.');$('recognized').focus()}
async function translate(){
 const source=$('recognized').innerText.trim();
 if(!source){msg('Сначала произнесите или введите текст');return}
 $('translated').classList.remove('hidden');$('translated').textContent='Перевод…';
 try{
 const query=new URLSearchParams({q:source,langpair:pair()});
 const response=await fetch('https://api.mymemory.translated.net/get?'+query);
 if(!response.ok)throw Error('HTTP '+response.status);
 const data=await response.json();
 if(!data.responseData?.translatedText||Number(data.responseStatus)>=400)throw Error('Сервис не ответил');
 $('translated').textContent=data.responseData.translatedText;
 msg('Перевод готов. Нажмите блок «Перевод», чтобы услышать.');
 }catch(e){$('translated').textContent='';msg('Не удалось перевести. Попробуйте позже.')}
}
function start(language){
 if(recording)stop();
 chosen=language;
 $('armenian').classList.toggle('tapped',language==='hy');
 $('chinese').classList.toggle('tapped',language==='zh');
 if(locked || !SpeechRec){fallback();return}
 try{
 recognition=new SpeechRec();
 recognition.lang=language==='hy'?'hy-AM':'zh-CN';
 recognition.continuous=false;recognition.interimResults=true;
 recognition.onstart=()=>{recording=true;msg('Слушаю…')};
 recognition.onresult=e=>{
 let value='';
 for(let i=0;i<e.results.length;i++)value+=e.results[i][0].transcript;
 $('recognized').classList.remove('hidden');
 $('recognized').textContent=value;
 if(e.results[e.results.length-1].isFinal)translate()
 };
 recognition.onend=()=>{recording=false};
 recognition.onerror=e=>{
 recording=false;
 if(['service-not-allowed','not-allowed','audio-capture'].includes(e.error)){fallback();return}
 msg('Ошибка записи: '+e.error+'. Можно ввести текст вручную.');
 };
 msg('Запрашиваю разрешение микрофона…');recognition.start();
 }catch(e){fallback()}
}
$('armenian').onclick=()=>start('hy');
$('chinese').onclick=()=>start('zh');
$('edit').onclick=()=>{$('recognized').classList.remove('hidden');if($('recognized').innerText.trim())translate();else{$('recognized').focus();msg('Введите текст или используйте диктовку клавиатуры iPhone')}};
$('recognized').addEventListener('blur',()=>{if($('recognized').innerText.trim())translate()});
$('speak').onclick=()=>{
 const text=$('translated').innerText.trim();
 if(!text)return msg('Сначала получите перевод');
 if(!('speechSynthesis' in window))return msg('Озвучивание недоступно на этом устройстве');
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang=targetLanguage();u.rate=.92;
 speechSynthesis.speak(u);
 msg('Озвучивание запущено, если голос доступен в системе.');
};
})();
</script></body></html>
