s({q:s,langpair:languages().pair});let r=await fetch('https://api.mymemory.translated.net/get?'+p);if(!r.ok)throw Error('Сервис недоступен');let j=await r.json();if(!j.responseData?.translatedText||Number(j.responseStatus)>=400)throw Error('Нет перевода');$('target').textContent=j.responseData.translatedText;info('Перевод готов');}catch(e){$('target').textContent='';info('Ошибка перевода: '+e.message)}}function startMic(){if(recording){stop();info('Запись остановлена');return}if(!window.isSecureContext){info('Для микрофона откройте сайт через HTTPS в Safari');return}if(!Recognizer){$('source').classList.remove('hidden');info('Этот браузер не поддерживает распознавание. Откройте ссылку в Safari или введите текст');return}try{rec=new Recognizer();rec.lang=languages().src;rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>{recording=true;info('🎙 Слушаю… говорите '+(selected==='hy'?'по-армянски':'по-китайски'))};rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$('source').classList.remove('hidden');$('source').textContent=s;if(e.results[e.results.length-1].isFinal)translate()};rec.onerror=e=>{recording=false;const m={not_allowed:'Разрешите доступ к микрофону в настройках Safari',service_not_allowed:'Сервис распознавания речи запрещён браузером',no_speech:'Речь не услышана. Нажмите микрофон и попробуйте снова',audio_capture:'Микрофон недоступен. Проверьте разрешения',network:'Ошибка сети службы распознавания речи',language_not_supported:'Этот язык не поддерживается распознаванием в текущем браузере'};info(m[e.error]||('Ошибка микрофона: '+e.error)+'. Можно ввести текст вручную')};rec.onend=()=>{recording=false};info('Запрашиваю доступ к микрофону…');rec.start()}catch(e){recording=false;info('Не удалось включить микрофон: '+e.message+'. Попробуйте Safari')}};$('micHy').onclick=()=>{select('hy');startMic()};$('micZh').onclick=()=>{select('zh');startMic()};$('translate').onclick=()=>{if($('source').classList.contains('hidden')){$('source').classList.remove('hidden');$('source').focus();info('Введите текст — перевод появится после ввода');}else translate()};$('source').addEventListener('blur',()=>{if($('source').innerText.trim())translate()});$('speak').onclick=()=>{let t=$('target').innerText;if(!t)return;if(!window.speechSynthesis)return info('Озвучивание недоступно');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=languages().dest;speechSynthesis.speak(u)};})();</script></body></html>
