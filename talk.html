ght:10%" aria-label="Озвучить перевод"></button></main><script>(()=>{const $=x=>document.getElementById(x),Recognizer=window.SpeechRecognition||window.webkitSpeechRecognition;let selected='hy',rec,recording=false;const info=s=>$('status').textContent=s;const languages=()=>selected==='hy'?{src:'hy-AM',dest:'zh-CN',pair:'hy|zh-CN'}:{src:'zh-CN',dest:'hy-AM',pair:'zh-CN|hy'};function stop(){recording=false;if(rec){try{rec.stop()}catch(e){}}}function select(s){stop();selected=s;$('hy').setAttribute('aria-pressed',s==='hy');$('zh').setAttribute('aria-pressed',s==='zh');info('Выбран '+(s==='hy'?'армянский':'китайский')+' язык')}$('hy').onclick=()=>select('hy');$('zh').onclick=()=>select('zh');$('stop').onclick=()=>{stop();info('Запись остановлена')};async function translate(){let s=$('source').innerText.trim();if(!s)return info('Введите или произнесите текст');$('target').classList.remove('hidden');$('target').textContent='Перевод…';try{let p=new URLSearchParams({q:s,langpair:languages().pair});let r=await fetch('https://api.mymemory.translated.net/get?'+p);if(!r.ok)throw Error('Сервис недоступен');let j=await r.json();if(!j.responseData?.translatedText||Number(j.responseStatus)>=400)throw Error('Нет перевода');$('target').textContent=j.responseData.translatedText;info('Перевод готов');}catch(e){$('target').textContent='';info('Ошибка перевода: '+e.message)}}$('mic').onclick=()=>{if(recording){stop();return}if(!Recognizer){$('source').classList.remove('hidden');info('Распознавание недоступно, введите текст');return}rec=new Recognizer();rec.lang=languages().src;rec.continuous=false;rec.interimResults=true;rec.onstart=()=>{recording=true;info('Слушаю…')};rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$('source').classList.remove('hidden');$('source').textContent=s;if(e.results[e.results.length-1].isFinal)translate()};rec.onerror=e=>info('Ошибка распознавания: '+e.error);rec.onend=()=>{recording=false};try{rec.start()}catch(e){info(e.message)}};$('translate').onclick=()=>{if($('source').classList.contains('hidden')){$('source').classList.remove('hidden');info('Введите текст и нажмите снова');}else translate()};$('speak').onclick=()=>{let t=$('target').innerText;if(!t)return;if(!window.speechSynthesis)return info('Озвучивание недоступно');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=languages().dest;speechSynthesis.speak(u)};})();</script></body></html>
