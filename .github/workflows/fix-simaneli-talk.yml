name: Fix Simaneli Talk overlay and iPhone voice
on:
  push:
    paths:
      - '.github/workflows/fix-simaneli-talk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing large HTML without modifying its artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('talk/index.html')
          s=p.read_text(encoding='utf-8')
          assert 'function unlock()' in s and 'id="source"' in s
          import re
          css="""
          <style id="simaneli-voice-fixes">
          /* The image already contains decorative speech/translation panels:
             crop those baked-in panels so only the functional full-text cards remain. */
          main{aspect-ratio:941/1020!important;background-size:100% auto!important;background-position:top center!important;overflow:hidden!important}
          #shop{top:31.4%!important;left:4%!important;width:92%!important;height:14.6%!important}
          #hy,#zh{top:68.8%!important;height:17.8%!important}
          #stop{top:89%!important;height:9.5%!important}
          #phone{display:none!important}
          #text-results{position:relative;z-index:2}
          #footer .talk-contact-link{display:block;background:linear-gradient(140deg,#112b43,#061525);border:2px solid #d6a65e;border-radius:16px;color:#f2d397;padding:14px 8px;font:600 19px Georgia,serif;text-align:center;text-decoration:none}
          /* Long speech and translation use normal document flow */
          #text-results{margin:18px auto!important;width:calc(100% - 52px)!important;max-width:470px!important;display:flex;flex-direction:column;gap:12px!important}
          .talk-result-panel{background:linear-gradient(160deg,#102840,#061526 85%);border:1.5px solid #d6a65e;box-shadow:0 0 0 1px #654b28,0 5px 18px #0007,inset 0 1px 0 #f9dda880;border-radius:19px;padding:15px 14px;color:#f7dca7}
          .talk-result-title{font:600 19px Georgia,serif;margin-bottom:10px;color:#f6d69c;text-shadow:0 0 6px #b5884155}
          #text-results #source,#text-results #target{position:static!important;display:block!important;top:auto!important;left:auto!important;width:100%!important;height:auto!important;min-height:70px!important;max-height:none!important;background:#071b30!important;border:1px solid #c59a58!important;border-radius:12px;padding:12px!important;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif!important;color:#f4dda9!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:break-word!important;overflow:visible!important}
          #text-results #source{resize:vertical!important}
          #text-results #target{min-height:70px!important}
          #status{position:static!important;top:auto!important;left:auto!important;width:100%!important;height:auto!important;min-height:34px;margin:10px auto!important;padding:9px!important;background:#092238!important;border:1px solid #ba904f;border-radius:14px;color:#f0d5a2!important;font-size:13px!important}
          #actions{position:static!important;top:auto!important;left:auto!important;transform:none!important;width:100%!important;display:flex!important;justify-content:center!important;gap:10px!important;margin:12px auto!important}
          #actions button{font-size:13px!important;white-space:nowrap}
          #recording{position:static!important;top:auto!important;left:auto!important;width:100%!important;margin:8px auto!important}
          #recording audio{display:block;width:100%;max-width:420px;margin:8px auto;height:36px}
          #recording audio[hidden]{display:none}
          #footer{width:calc(100% - 52px)!important;max-width:470px!important;padding:18px 15px 45px!important;display:flex!important;flex-direction:column!important;gap:12px!important;margin:16px auto 36px!important;border-radius:19px!important;background:linear-gradient(145deg,#11283d,#061527)!important;box-shadow:0 3px 16px #0006!important}#footer #actions{order:1}#footer #recording{order:2}#footer #status{order:3}#footer #wechatnote{order:4}#footer audio{position:relative!important}#footer #actions button{min-height:42px}
          @media(max-width:390px){#actions button{font-size:11px!important;padding:8px!important}}
          /* Compact symmetric gold panels */
          #text-results{width:calc(100% - 84px)!important;max-width:410px!important;gap:11px!important;align-items:stretch!important}
          #text-results .talk-result-panel{width:100%!important;box-sizing:border-box!important;padding:11px 12px!important;border:2px solid #e8b968!important;border-radius:15px!important;background:linear-gradient(145deg,#142d43,#041525)!important;box-shadow:0 0 0 1px #775327,0 0 12px #dea45366,inset 0 1px #ffe5ac!important}
          #text-results .talk-result-title{font-size:18px!important;margin-bottom:7px!important;color:#ffdb98!important}
          #text-results #source,#text-results #target{min-height:56px!important;padding:9px 10px!important;font-size:15px!important;border:1px solid #d6a65d!important;border-radius:10px!important}
          #footer{width:calc(100% - 84px)!important;max-width:410px!important}
          </style>"""
          if 'id="simaneli-voice-fixes"' in s:
            s=re.sub(r'<style id="simaneli-voice-fixes">.*?</style>',css.strip(),s,count=1,flags=re.S)
          else:
            s=s.replace('</head>',css+'</head>',1)
          instagram_css = """
          <style id="simaneli-instagram-css">
          #simaneli-instagram-link{display:flex;align-items:center;justify-content:center;gap:11px;width:calc(100% - 84px);max-width:410px;margin:17px auto 12px;padding:13px 12px;border-radius:15px;border:2px solid #e8b968;background:linear-gradient(145deg,#122b43,#041525);color:#f9d59a;text-decoration:none;font:600 17px Georgia,serif;box-shadow:0 0 12px #dea45366,inset 0 1px #ffe5ac}
          #simaneli-instagram-link svg{flex:none}
          </style>"""
          if 'id="simaneli-instagram-css"' not in s:
            s=s.replace('</head>',instagram_css+'</head>',1)
          instagram_script = """<script id="simaneli-instagram-script">
          (function(){
            const main=document.querySelector('main');
            if(!main||document.getElementById('simaneli-instagram-link'))return;
            const a=document.createElement('a');
            a.id='simaneli-instagram-link';
            a.href='https://www.instagram.com/m_simaneli/';
            a.target='_blank';a.rel='noopener noreferrer';
            a.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f9d59a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.5" r="1" fill="#f9d59a" stroke="none"/></svg><span>Instagram · @m_simaneli ↗</span>';
            main.insertAdjacentElement('afterend',a);
          })();
          </script>"""
          if 'id="simaneli-instagram-script"' not in s:
            s=s.replace('</body>',instagram_script+'</body>',1)
          relocation="""<script id="simaneli-layout-relocation">
          (function(){
            const footer=document.getElementById('footer');
            if(!footer)return;
            ['status','actions','recording'].forEach(id=>{const el=document.getElementById(id);if(el)footer.insertBefore(el,footer.firstChild)});
          })();
          </script>"""
          if 'id="simaneli-layout-relocation"' not in s:
            s=s.replace('</body>',relocation+'</body>',1)
          contact_script="""<script id="simaneli-contact-card">
          (function(){
            const footer=document.getElementById('footer');
            if(!footer||footer.querySelector('.talk-contact-link'))return;
            const a=document.createElement('a');
            a.className='talk-contact-link';
            a.href='tel:+8617520055552';
            a.textContent='☎ Связаться с нами · +86 175 2005 5552';
            footer.prepend(a);
          })();
          </script>"""
          if 'id="simaneli-contact-card"' not in s:
            s=s.replace('</body>',contact_script+'</body>',1)
          long_results="""<script id="simaneli-long-results">
          (function(){
            const main=document.querySelector('main'),src=document.getElementById('source'),target=document.getElementById('target');
            if(!main||!src||!target||document.getElementById('text-results'))return;
            const wrapper=document.createElement('section');wrapper.id='text-results';
            const makePanel=(heading,node)=>{
              const panel=document.createElement('div');panel.className='talk-result-panel';
              const title=document.createElement('div');title.className='talk-result-title';title.textContent=heading;
              panel.append(title,node);return panel;
            };
            wrapper.append(makePanel('Распознанная речь',src),makePanel('Перевод',target));
            main.after(wrapper);
            const resize=()=>{src.style.height='auto';src.style.height=Math.max(70,src.scrollHeight+8)+'px'};
            src.addEventListener('input',resize);
            new MutationObserver(()=>{const n=target.textContent.length;if(n)target.style.minHeight='70px'}).observe(target,{childList:true,characterData:true,subtree:true});
            new MutationObserver(resize).observe(src,{attributes:true,attributeFilter:['value']});
            setInterval(resize,900);
            resize();
          })();
          </script>"""
          if 'id="simaneli-long-results"' not in s:
            s=s.replace('</body>',long_results+'</body>',1)
          voice_hook = """<script id="simaneli-speech-unlock">
          document.addEventListener('pointerdown',function(e){
            if(!e.target.closest('#hy,#zh'))return;
            try{
              if(!window.speechSynthesis)return;
              speechSynthesis.cancel();
              const u=new SpeechSynthesisUtterance(' ');
              u.lang='zh-CN';u.volume=0;
              speechSynthesis.speak(u);
              if(speechSynthesis.paused)speechSynthesis.resume();
            }catch(_){}
          },true);
          </script>"""
          if 'id="simaneli-speech-unlock"' not in s:
            s=s.replace('</body>',voice_hook+'</body>',1)
          old='function unlock(){try{if("speechSynthesis" in window)speechSynthesis.getVoices()}catch{}}'
          new='''function unlock(){try{if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(" ");u.lang="zh-CN";u.volume=0;speechSynthesis.speak(u)}}catch{}}'''
          if old in s:
            s=s.replace(old,new,1)
          else:
            print('Existing voice initializer differs; preserving existing JavaScript')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talk/index.html
          git diff --cached --quiet || git commit -m "Separate speech controls and fix overlap"
          git push
