name: Fix Simaneli Talk overlay and iPhone voice
on:
  push:
    paths:
      - '.github/workflows/fix-simaneli-talk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing large HTML without modifying its artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('talk/index.html')
          s=p.read_text(encoding='utf-8')
          assert 'function unlock()' in s and 'id="source"' in s
          import re
          css="""
          <style id="simaneli-voice-fixes">
          /* Long speech and translation use normal document flow */
          #text-results{margin:14px auto;width:min(94%,580px);display:flex;flex-direction:column;gap:14px}
          .talk-result-panel{background:#06192c;border:2px solid #d6a65e;box-shadow:0 0 12px #d6a65e66;border-radius:17px;padding:14px;color:#f7dca7}
          .talk-result-title{font:600 21px Georgia,serif;margin-bottom:10px}
          #text-results #source,#text-results #target{position:static!important;display:block!important;top:auto!important;left:auto!important;width:100%!important;height:auto!important;min-height:110px!important;max-height:none!important;background:#071b30!important;border:1px solid #c59a58!important;border-radius:12px;padding:12px!important;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif!important;color:#f4dda9!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:break-word!important;overflow:visible!important}
          #text-results #source{resize:vertical!important}
          #text-results #target{min-height:100px!important}
          #status{position:static!important;top:auto!important;left:auto!important;width:100%!important;height:auto!important;min-height:34px;margin:10px auto!important;padding:9px!important;background:#092238!important;border:1px solid #ba904f;border-radius:14px;color:#f0d5a2!important;font-size:13px!important}
          #actions{position:static!important;top:auto!important;left:auto!important;transform:none!important;width:100%!important;display:flex!important;justify-content:center!important;gap:10px!important;margin:12px auto!important}
          #actions button{font-size:13px!important;white-space:nowrap}
          #recording{position:static!important;top:auto!important;left:auto!important;width:100%!important;margin:8px auto!important}
          #recording audio{display:block;width:100%;max-width:420px;margin:8px auto;height:36px}
          #recording audio[hidden]{display:none}
          #footer{padding:18px 14px 110px!important;display:flex!important;flex-direction:column!important;gap:12px!important;margin-top:22px!important}#footer #actions{order:1}#footer #recording{order:2}#footer #status{order:3}#footer #wechatnote{order:4}#footer audio{position:relative!important}#footer #actions button{min-height:42px}
          @media(max-width:390px){#actions button{font-size:11px!important;padding:8px!important}}
          </style>"""
          if 'id="simaneli-voice-fixes"' in s:
            s=re.sub(r'<style id="simaneli-voice-fixes">.*?</style>',css.strip(),s,count=1,flags=re.S)
          else:
            s=s.replace('</head>',css+'</head>',1)
          relocation="""<script id="simaneli-layout-relocation">
          (function(){
            const footer=document.getElementById('footer');
            if(!footer)return;
            ['status','actions','recording'].forEach(id=>{const el=document.getElementById(id);if(el)footer.insertBefore(el,footer.firstChild)});
          })();
          </script>"""
          if 'id="simaneli-layout-relocation"' not in s:
            s=s.replace('</body>',relocation+'</body>',1)
          long_results="""<script id="simaneli-long-results">
          (function(){
            const main=document.querySelector('main'),src=document.getElementById('source'),target=document.getElementById('target');
            if(!main||!src||!target||document.getElementById('text-results'))return;
            const wrapper=document.createElement('section');wrapper.id='text-results';
            const makePanel=(heading,node)=>{
              const panel=document.createElement('div');panel.className='talk-result-panel';
              const title=document.createElement('div');title.className='talk-result-title';title.textContent=heading;
              panel.append(title,node);return panel;
            };
            wrapper.append(makePanel('Распознанная речь',src),makePanel('Перевод',target));
            main.after(wrapper);
            const resize=()=>{src.style.height='auto';src.style.height=Math.max(110,src.scrollHeight+8)+'px'};
            src.addEventListener('input',resize);
            new MutationObserver(()=>{const n=target.textContent.length;if(n)target.style.minHeight='110px'}).observe(target,{childList:true,characterData:true,subtree:true});
            new MutationObserver(resize).observe(src,{attributes:true,attributeFilter:['value']});
            setInterval(resize,900);
            resize();
          })();
          </script>"""
          if 'id="simaneli-long-results"' not in s:
            s=s.replace('</body>',long_results+'</body>',1)
          voice_hook = """<script id="simaneli-speech-unlock">
          document.addEventListener('pointerdown',function(e){
            if(!e.target.closest('#hy,#zh'))return;
            try{
              if(!window.speechSynthesis)return;
              speechSynthesis.cancel();
              const u=new SpeechSynthesisUtterance(' ');
              u.lang='zh-CN';u.volume=0;
              speechSynthesis.speak(u);
              if(speechSynthesis.paused)speechSynthesis.resume();
            }catch(_){}
          },true);
          </script>"""
          if 'id="simaneli-speech-unlock"' not in s:
            s=s.replace('</body>',voice_hook+'</body>',1)
          old='function unlock(){try{if("speechSynthesis" in window)speechSynthesis.getVoices()}catch{}}'
          new='''function unlock(){try{if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(" ");u.lang="zh-CN";u.volume=0;speechSynthesis.speak(u)}}catch{}}'''
          if old in s:
            s=s.replace(old,new,1)
          else:
            print('Existing voice initializer differs; preserving existing JavaScript')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talk/index.html
          git diff --cached --quiet || git commit -m "Separate speech controls and fix overlap"
          git push
