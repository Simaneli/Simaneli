name: Fix Simaneli Talk overlay and iPhone voice
on:
  push:
    paths:
      - '.github/workflows/fix-simaneli-talk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing large HTML without modifying its artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('talk/index.html')
          s=p.read_text(encoding='utf-8')
          assert 'function unlock()' in s and 'id="source"' in s
          css="""
          <style id="simaneli-voice-fixes">
          /* Separate live text and audio controls from the static illustration */
          #source{top:71.7%!important;height:2.8%!important;resize:none!important}
          #target{top:82.7%!important;height:2.8%!important;overflow:auto!important}
          #status{top:60.3%!important;height:2.3%!important;left:13%!important;width:74%!important;background:#061728f2;border-radius:14px;font-size:12px!important;z-index:3}
          #actions{top:87.2%!important;z-index:4;gap:8px}
          #actions button{font-size:12px!important;white-space:nowrap}
          #recording{position:static!important;margin:0 auto!important;width:88%!important;text-align:center}
          #recording audio{display:block;width:100%;max-width:420px;margin:8px auto;height:34px}
          #recording audio[hidden]{display:none}
          @media(max-width:390px){#actions button{font-size:10px!important;padding:4px 7px!important}}
          </style>"""
          s=s.replace('</head>',css+'</head>',1)
          old='function unlock(){try{if("speechSynthesis" in window)speechSynthesis.getVoices()}catch{}}'
          new='''function unlock(){try{if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(" ");u.lang="zh-CN";u.volume=0;speechSynthesis.speak(u)}}catch{}}'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talk/index.html
          git commit -m "Fix overlay positions and prime iPhone speech synthesis"
          git push
