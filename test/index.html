<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simaneli — проверка каталога</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#231c16;font-family:system-ui,-apple-system,sans-serif}header{background:#fff;padding:20px 16px;border-bottom:1px solid #e8ddd1}h1{font:32px Georgia,serif;letter-spacing:5px;margin:0}.wrap{max-width:980px;margin:auto;padding:16px}#status{padding:13px;border-radius:12px;background:#fff;margin:12px 0;white-space:pre-wrap;font-size:14px}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e9dfd2;border-radius:16px;overflow:hidden;text-align:left;color:inherit;padding:0;font:inherit;cursor:pointer}.card img{display:block;width:100%;height:205px;object-fit:contain;background:#f5f2ee}.pad{padding:12px}.name{font-weight:700}.muted{color:#867b70;font-size:12px}.price{font-weight:800;padding-top:7px}button{touch-action:manipulation}#overlay{position:fixed;inset:0;background:#0009;display:none;z-index:100;overflow:auto;padding:18px}#overlay.open{display:block}.panel{background:white;border-radius:20px;max-width:520px;margin:18px auto;padding:18px}.panel img{width:100%;max-height:340px;object-fit:contain}.primary{background:#94703f;color:white;border:0;border-radius:12px;padding:14px;width:100%;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:50%;height:40px;width:40px;font-size:26px}#log{font-size:12px;color:#645a51;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:6px 11px;border:1px solid #d2c7ba;border-radius:12px;margin:3px}.small{font-size:12px;color:#777}@media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><h1>SIMANELI</h1><div class="small">Безопасная тестовая страница · основной магазин не изменён</div></header><main class="wrap"><h2>Проверка карточек товаров</h2><div id="status">Запуск проверки...</div><button class="primary" id="mock">Проверить открытие тестовой карточки</button><h3>Товары из действующей базы</h3><div id="grid"></div><h3>Диагностика</h3><div id="log"></div></main><div id="overlay" role="dialog" aria-modal="true"><div class="panel"><div class="top"><b>Карточка товара</b><button class="close" id="close" aria-label="Закрыть">×</button></div><img id="photo" alt=""><h2 id="name"></h2><p id="price"></p><div id="sizes"></div><div id="colors"></div><p id="description"></p><button class="primary" id="add">Добавить в тестовую корзину</button><p id="feedback"></p></div></div><script>
const url="https://euuqxtpumhecvbsainms.supabase.co", key="sb_publishable_ilqXAt3lZkQ3wOHXr2LKGA_4sRHer9u";
const $=id=>document.getElementById(id);let data=[],chosen=null,count=0;
function log(t){$("log").textContent+=new Date().toLocaleTimeString()+" — "+t+"\n";}
function imgOf(p){let v=p.image_url||"";try{const x=JSON.parse(v);if(Array.isArray(x))v=x[0]||"";}catch(e){}return typeof v==="string"&&/^(https?:|data:image\/)/.test(v)?v:"";}
function money(p){return Number(p.sale_price||0).toLocaleString("ru-RU")+" "+(p.currency||"AMD");}
function openCard(p){try{chosen=p;$("photo").src=imgOf(p);$("photo").style.display=imgOf(p)?"block":"none";$("name").textContent=p.name||"Товар";$("price").textContent=money(p);$("sizes").textContent="Размеры: "+(Array.isArray(p.sizes)?p.sizes.join(", "):"—");$("colors").textContent="Цвета: "+(Array.isArray(p.colors)?p.colors.join(", "):"—");$("description").textContent=p.description||"";$("feedback").textContent="";$("overlay").classList.add("open");log("Карточка открылась: "+(p.sku||"test"));}catch(e){log("Ошибка открытия: "+String(e));alert("Ошибка: "+e.message);}}
$("close").onclick=()=>$("overlay").classList.remove("open");
$("overlay").onclick=e=>{if(e.target===$("overlay"))$("overlay").classList.remove("open")};
$("mock").onclick=()=>openCard({sku:"TEST",name:"Проверка открытия карточки",sale_price:100,currency:"AMD",sizes:["M","L"],colors:["Чёрный"]});
$("add").onclick=()=>{$("feedback").textContent="Кнопка работает. Добавлено в тестовую корзину: "+(++count);log("Кнопка добавить нажата");};
window.addEventListener("error",e=>log("JS: "+e.message));
window.addEventListener("unhandledrejection",e=>log("Promise: "+String(e.reason)));
async function init(){try{log("Запрос к Supabase");const r=await fetch(url+"/rest/v1/products?select=*&active=eq.true&order=created_at.asc",{headers:{apikey:key,Authorization:"Bearer "+key}});if(!r.ok)throw Error("HTTP "+r.status+": "+(await r.text()).slice(0,280));const rows=await r.json();if(!Array.isArray(rows))throw Error("Ответ не массив");data=rows;$("status").textContent="Соединение с базой успешно. Получено товаров: "+data.length;log("Загружено "+data.length+" товаров");for(const p of data){const b=document.createElement("button");b.className="card";const im=document.createElement("img");im.loading="lazy";im.alt=p.name||"";const src=imgOf(p);if(src)im.src=src;const div=document.createElement("div");div.className="pad";const name=document.createElement("div");name.className="name";name.textContent=p.name||"Товар";const sku=document.createElement("div");sku.className="muted";sku.textContent=p.sku||"";const price=document.createElement("div");price.className="price";price.textContent=money(p);div.append(name,sku,price);b.append(im,div);b.onclick=()=>openCard(p);$("grid").append(b);}if(!data.length)log("База вернула пустой список, проверьте active и политики доступа");}catch(e){$("status").textContent="Ошибка загрузки каталога: "+e.message;log("Ошибка Supabase: "+e.message);}}
init();</script></body></html>
