<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simaneli— Admin</title>
<style>
:root{--bg:#f4f1eb;--card:#fff;--text:#222;--muted:#777;--line:#e4ddd3;--dark:#252525}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-family:Georgia,serif;letter-spacing:2px;font-size:26px}.sub{font:12px Arial;color:#777;letter-spacing:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.login{max-width:430px;margin:70px auto}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}
input,select,textarea,button{font:inherit}input,select,textarea{padding:11px;border:1px solid #d8d1c7;border-radius:12px;background:#fff;width:100%}
textarea{min-height:90px;resize:vertical}button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer}
.primary{background:var(--dark);color:#fff}.ghost{background:#eee;color:#222}.danger{background:#ffe8e8;color:#a21d1d}
.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#eee}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#e9e5df}.tab.active{background:#252525;color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px}
.orders,.products{display:grid;gap:12px}
.order,.product{display:grid;grid-template-columns:1.1fr 1.1fr .9fr .7fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px}
.small{font-size:12px;color:var(--muted)}.title{font-weight:700}.money{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}.items{grid-column:1/-1;background:#faf8f5;border-radius:12px;padding:10px;display:none}
.order.open .items{display:block}.itemrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #ece7e0}
.empty{text-align:center;color:#777;padding:36px 0}.err{color:#b42318}.ok{color:#157347}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);padding:20px;z-index:10;overflow:auto}
.modal.show{display:block}.modalbox{max-width:720px;margin:20px auto;background:#fff;border-radius:18px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.preview{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#eee;border:1px solid #ddd}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.photo-item{position:relative;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#f6f6f6;aspect-ratio:1}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .photo-num{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:3px 6px;border-radius:999px}
.photo-item .remove-photo{position:absolute;right:6px;top:6px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:#a21d1d;font-weight:700}
.photo-help{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:850px){.order,.product{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Simaneli <span class="sub">ADMIN</span></div>
    <div id="userBox"></div>
  </div>

  <section id="loginView" class="card login">
    <h2 style="margin-top:0">Вход администратора</h2>
    
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%" onclick="login()">Войти</button>
    <div id="loginMsg" class="small" style="margin-top:10px"></div>
  </section>

  <section id="adminView" style="display:none">
    <div class="tabs">
      <button id="tabOrders" class="tab active" onclick="showTab('orders')">Заказы</button>
      <button id="tabProducts" class="tab" onclick="showTab('products')">Товары</button>
    </div>

    <div id="ordersView">
      <div class="toolbar">
        <input id="orderSearch" placeholder="Поиск: заказ, имя, телефон..." oninput="renderOrders()">
        <select id="orderStatus" onchange="renderOrders()">
          <option value="">Все статусы</option>
          <option>new</option><option>confirmed</option><option>paid</option><option>purchased</option><option>shipped</option><option>delivered</option>
        </select>
        <button class="ghost" onclick="loadOrders()">Обновить</button>
      </div>
      <div class="card"><div id="orders" class="orders"></div></div>
    </div>

    <div id="productsView" style="display:none">
      <div class="toolbar">
        <input id="productSearch" placeholder="Поиск: SKU, название..." oninput="renderProducts()">
        <select id="productActive" onchange="renderProducts()">
          <option value="">Все товары</option><option value="true">Активные</option><option value="false">Скрытые</option>
        </select>
        <button class="primary" onclick="openProduct()">+ Добавить товар</button>
        <button class="ghost" onclick="loadProducts()">Обновить</button>
      </div>
      <div class="card"><div id="products" class="products"></div></div>
    </div>
  </section>
</div>

<div id="productModal" class="modal">
  <div class="modalbox">
    <h2 id="productModalTitle" style="margin-top:0">Товар</h2>
    <input id="p_id" type="hidden">
    <div class="grid2">
      <div class="field"><label>SKU</label><input id="p_sku"></div>
      <div class="field"><label>Название</label><input id="p_name"></div>
      <div class="field"><label>Категория</label><input id="p_category" list="productCategoryOptions" placeholder="Выберите или впишите категорию"><datalist id="productCategoryOptions"><option value="Мужские кроссовки"><option value="Мужские спортивные костюмы"><option value="Мужские джинсовые брюки"><option value="Мужские джинсы"><option value="Мужские брюки"><option value="Мужские кофты"><option value="Мужские футболки"><option value="Мужские куртки"><option value="Мужская верхняя одежда"><option value="Женские платья"><option value="Женские кофты"><option value="Женские спортивные костюмы"><option value="Женские джинсовые брюки"><option value="Женские джинсы"><option value="Женские брюки"><option value="Женские футболки"><option value="Женские куртки"><option value="Женская верхняя одежда"><option value="Женская обувь"><option value="Мужская обувь"><option value="Смартфоны"><option value="Ноутбуки"><option value="Планшеты"><option value="Смарт-часы"><option value="Наушники"><option value="Аксессуары для электроники"><option value="Другая техника"><option value="Электромобили"><option value="Автомобили"><option value="Электроскутеры"><option value="Электромотоциклы"><option value="Электровелосипеды"><option value="Генераторы"><option value="Крупная бытовая техника"><option value="Промышленное оборудование"><option value="HandMade"><option value="Продукты питания"><option value="Автозапчасти"><option value="Парфюмерия"><option value="Хозяйственные товары"><option value="Аксессуары"><option value="Сумки"><option value="Очки"></datalist></div>
      <div class="field"><label>Валюта</label><select id="p_currency"><option>AMD</option><option>USD</option><option>CNY</option><option>GEL</option></select></div>
      <div class="field"><label>Цена продажи</label><input id="p_sale" type="number" step="0.01"></div>
      <div class="field"><label>Скидка %</label><input id="p_discount" type="number" min="0" max="100" value="0"></div>
<div class="field"><label>Закупочная цена</label><input id="p_purchase" type="number" step="0.01"></div>
      <div class="field"><label>Размеры через запятую</label><input id="p_sizes" placeholder="M, L, XL"></div>
      <div class="field"><label>Цвета через запятую</label><input id="p_colors" placeholder="Black, Beige"></div>
      <div class="field"><label>MOQ</label><input id="p_moq" type="number" value="1"></div>
      <div class="field"><label>Остаток</label><input id="p_stock" type="number" placeholder="можно оставить пустым"></div>
      <div class="field" style="grid-column:1/-1">
        <label>Фотографии товара</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input id="p_file" type="file" accept="image/*" multiple style="max-width:320px">
          <button type="button" class="ghost" onclick="uploadProductImages()">Загрузить выбранные фото</button>
        </div>
        <div class="photo-help">Можно добавить до 10 фотографий. Первая фотография — главная.</div>
        <div id="photoGrid" class="photo-grid"></div>
        <div id="uploadMsg" class="small" style="margin-top:6px"></div>
      </div>
      <div class="field" style="grid-column:1/-1"><label>Описание</label><textarea id="p_description"></textarea></div>
      <div class="field"><label><input id="p_active" type="checkbox" checked style="width:auto"> Активный товар</label></div>
    </div>
    <div class="row">
      <button class="ghost" onclick="closeProduct()">Отмена</button>
      <button class="primary" onclick="saveProduct()">Сохранить</button>
    </div>
    <div id="productMsg" class="small" style="margin-top:10px"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://euuqxtpumhecvbsainms.supabase.co";
const SUPABASE_KEY="sb_publishable_ilqXAt3lZkQ3wOHXr2LKGA_4sRHer9u";
const statuses=["new","confirmed","paid","purchased","shipped","delivered"];
let session=JSON.parse(localStorage.getItem("cd_admin_session")||"null");
let ordersData=[], productsData=[];
let productImages=[];

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function money(n,c="AMD"){const v=new Intl.NumberFormat("ru-RU").format(Number(n||0)); return c==="AMD"?v+" ֏":v+" "+c}
function arr(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}
function parseImages(v){
  if(Array.isArray(v)) return v.filter(Boolean).slice(0,10);
  const s=String(v||"").trim();
  if(!s) return [];
  if(s.startsWith("[")){try{const a=JSON.parse(s);if(Array.isArray(a))return a.filter(Boolean).slice(0,10)}catch(e){}}
  return [s];
}
function firstImage(v){return parseImages(v)[0]||""}
function renderPhotoGrid(){
  if(!window.photoGrid)return;
  if(!productImages.length){photoGrid.innerHTML='<div class="small">Фото пока не добавлены</div>';return}
  photoGrid.innerHTML=productImages.map((u,i)=>'<div class="photo-item"><img src="'+esc(u)+'" alt="Фото '+(i+1)+'"><span class="photo-num">'+(i===0?"Главная":"Фото "+(i+1))+'</span><button type="button" class="remove-photo" onclick="removeProductImage('+i+')">×</button></div>').join("");
}
function removeProductImage(i){productImages.splice(i,1);renderPhotoGrid()}

async function login(){
  loginMsg.textContent="Входим...";
  const res=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:password.value})});
  const data=await res.json();
  if(!res.ok){loginMsg.textContent=data.error_description||data.msg||"Ошибка входа";loginMsg.className="small err";return}
  session=data; localStorage.setItem("cd_admin_session",JSON.stringify(session)); showAdmin();
}
function logout(){localStorage.removeItem("cd_admin_session");location.reload()}
async function authFetch(path,opts={}){
  const headers={...(opts.headers||{}),apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token};
  return fetch(SUPABASE_URL+path,{...opts,headers});
}
function showAdmin(){loginView.style.display="none";adminView.style.display="block";userBox.innerHTML='<span class="badge">'+esc(session?.user?.email||"admin")+'</span> <button class="ghost" onclick="logout()">Выйти</button>';loadOrders();}
function showTab(t){ordersView.style.display=t==="orders"?"block":"none";productsView.style.display=t==="products"?"block":"none";tabOrders.classList.toggle("active",t==="orders");tabProducts.classList.toggle("active",t==="products");if(t==="products")loadProducts();}

async function loadOrders(){
  orders.innerHTML='<div class="empty">Загрузка...</div>';
  const r=await authFetch("/rest/v1/orders?select=*&order=created_at.desc");
  if(!r.ok){orders.innerHTML='<div class="empty err">Не удалось загрузить заказы</div>';return}
  ordersData=await r.json();renderOrders();
}
function renderOrders(){
  const q=(orderSearch.value||"").toLowerCase(), fs=orderStatus.value;
  const rows=ordersData.filter(o=>{const blob=[o.order_number,o.order_name,o.phone,o.country,o.city,o.address].join(" ").toLowerCase();return(!q||blob.includes(q))&&(!fs||o.status===fs)});
  if(!rows.length){orders.innerHTML='<div class="empty">Заказов не найдено</div>';return}
  orders.innerHTML=rows.map(o=>{const items=Array.isArray(o.items)?o.items:[];return `<div class="order" id="o${o.id}">
  <div><div class="title">${esc(o.order_number)}</div><div class="small">${esc(new Date(o.created_at).toLocaleString("ru-RU"))}</div></div>
  <div><div>${esc(o.order_name)}</div><div class="small">${esc(o.phone)}</div></div>
 <div>
  <div>${esc(o.city||o.country||"")}</div>
  <div class="small">
    Оплата: ${
      o.payment_method==="alipay" ? "Alipay" :
      o.payment_method==="usdt" ? "USDT TRC20" :
o.payment_method==="cash" ? "Оплата при получении" :
o.payment_method==="bank" ? "Банковский перевод" :
"Не указано"
    }
  </div>
</div>
<div class="money">${money(o.total)}</div>
  <div class="actions"><select onchange="setStatus(${o.id},this.value)">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><button class="ghost" onclick="document.getElementById('o${o.id}').classList.toggle('open')">Товары</button></div>
  <div class="items">${items.length?items.map(i=>`
  <div class="itemrow">
    <span>
      <b>${esc(i.name||i.title||"Товар")}</b><br>
      SKU: ${esc(i.sku||"-")}<br>
      Размер: ${esc(i.size||i.selectedSize||"-")}<br>
      Цвет: ${esc(i.color||i.selectedColor||"-")}<br>
      Количество: ${esc(i.qty||1)}
    </span>
    <span>${money((i.price||0)*(i.qty||1))}</span>
  </div>
`).join(""):"Нет данных"}</div>`}).join("");
}
async function setStatus(id,status){const r=await authFetch("/rest/v1/orders?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({status})});if(!r.ok)alert("Не удалось изменить статус");}

async function loadProducts(){
  products.innerHTML='<div class="empty">Загрузка...</div>';
  const r=await authFetch("/rest/v1/products?select=*&order=created_at.desc");
  if(!r.ok){products.innerHTML='<div class="empty err">Таблица products ещё не готова или нет доступа.</div>';return}
  productsData=await r.json();renderProducts();
}
function renderProducts(){
  const q=(productSearch.value||"").toLowerCase(), fa=productActive.value;
  const rows=productsData.filter(p=>{const blob=[p.sku,p.name,p.category].join(" ").toLowerCase();return(!q||blob.includes(q))&&(!fa||String(p.active)===fa)});
  if(!rows.length){products.innerHTML='<div class="empty">Товаров не найдено</div>';return}
  products.innerHTML=rows.map(p=>`<div class="product">
    <div style="display:flex;gap:10px;align-items:center">${firstImage(p.image_url)?`<img class="preview" src="${esc(firstImage(p.image_url))}">`:'<div class="preview"></div>'}<div><div class="title">${esc(p.name)}</div><div class="small">${esc(p.sku)}</div></div></div>
    <div><div>${esc(p.category||"")}</div><div class="small">MOQ ${esc(p.moq)}</div></div>
    <div><div class="money">${money(p.sale_price,p.currency)}</div><div class="small">Закупка: ${money(p.purchase_price,p.currency)}</div></div>
    <div>${p.active?"Активный":"Скрыт"}</div>
    <div class="actions"><button class="ghost" onclick="openProduct(${p.id})">Изменить</button><button class="danger" onclick="deleteProduct(${p.id})">Удалить</button></div>
  </div>`).join("");
}
function openProduct(id=null){
  productMsg.textContent="";if(window.uploadMsg){uploadMsg.textContent=""}if(window.p_file){p_file.value=""};
  const p=id?productsData.find(x=>x.id===id):null;
  p_id.value=p?.id||"";p_sku.value=p?.sku||"";p_name.value=p?.name||"";p_category.value=p?.category||"";p_currency.value=p?.currency||"AMD";
 ; p_sale.value=p?.sale_price??"";
p_discount.value=p?.discount_percent??0;
p_purchase.value=p?.purchase_price??"";p_sizes.value=(p?.sizes||[]).join(", ");p_colors.value=(p?.colors||[]).join(", ");
  p_moq.value=p?.moq??1;p_stock.value=p?.stock??"";productImages=parseImages(p?.image_url);p_description.value=p?.description||"";p_active.checked=p?.active??true;renderPhotoGrid();
  productModalTitle.textContent=p?"Редактировать товар":"Добавить товар";productModal.classList.add("show");
}
function closeProduct(){productModal.classList.remove("show")}

async function uploadProductImages(){
  uploadMsg.textContent="";
  const files=Array.from(p_file.files||[]);
  if(!files.length){uploadMsg.textContent="Сначала выбери фотографии";uploadMsg.className="small err";return}
  if(!session?.access_token){uploadMsg.textContent="Нужно войти в админку";uploadMsg.className="small err";return}
  if(productImages.length+files.length>10){uploadMsg.textContent="Максимум 10 фотографий на один товар";uploadMsg.className="small err";return}
  uploadMsg.textContent="Загрузка 0 из "+files.length+"...";uploadMsg.className="small";
  const base=(p_sku.value.trim()||"product").replace(/[^a-zA-Z0-9_-]/g,"-");
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
      const path=base+"/"+Date.now()+"-"+i+"."+ext;
      const r=await fetch(SUPABASE_URL+"/storage/v1/object/products/"+encodeURI(path),{
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token,"Content-Type":file.type||"application/octet-stream","x-upsert":"false"},
        body:file
      });
      if(!r.ok) throw new Error(await r.text());
      const publicUrl=SUPABASE_URL+"/storage/v1/object/public/products/"+encodeURI(path);
      productImages.push(publicUrl);renderPhotoGrid();
      uploadMsg.textContent="Загрузка "+(i+1)+" из "+files.length+"...";
    }
    uploadMsg.textContent="Фотографии загружены: "+files.length;uploadMsg.className="small ok";p_file.value="";
  }catch(e){
    console.error(e);
    uploadMsg.textContent="Ошибка: "+(e?.message||String(e));uploadMsg.className="small err";
  }
}

async function saveProduct(){
  const payload={sku:p_sku.value.trim(),name:p_name.value.trim(),category:p_category.value.trim(),currency:p_currency.value,sale_price:Number(p_sale.value||0),discount_percent:Number(p_discount.value||0), purchase_price:Number(p_purchase.value||0),sizes:arr(p_sizes.value),colors:arr(p_colors.value),moq:Number(p_moq.value||1),stock:p_stock.value===""?null:Number(p_stock.value),image_url:productImages.length?JSON.stringify(productImages):null,description:p_description.value.trim(),active:p_active.checked,updated_at:new Date().toISOString()};
  if(!payload.sku||!payload.name){productMsg.textContent="Нужны SKU и название";productMsg.className="small err";return}
  const id=p_id.value;
  const path=id?"/rest/v1/products?id=eq."+id:"/rest/v1/products";
  const r=await authFetch(path,{method:id?"PATCH":"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)});
  if(!r.ok){productMsg.textContent=await r.text();productMsg.className="small err";return}
  closeProduct();await loadProducts();
}
async function deleteProduct(id){if(!confirm("Удалить товар?"))return;const r=await authFetch("/rest/v1/products?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});if(!r.ok)alert("Не удалось удалить");else loadProducts();}

if(session?.access_token)showAdmin();
</script>
</body>
</html>
